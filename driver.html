<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver App Installer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 480px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo img {
      width: 160px;
      height: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    .driver-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .driver-logo img {
      width: 120px;
      height: auto;
    }
    p {
      text-align: center;
      color: #8b949e;
      margin-bottom: 24px;
    }
    a.button {
      display: block;
      text-align: center;
      background: #d62828;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    a.button:hover {
      background: #b91c1c;
    }
    .note {
      font-size: 0.9em;
      margin-top: 18px;
      color: #9da7b2;
      text-align: center;
    }
    footer {
      margin-top: 30px;
      font-size: 0.85em;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="image/bjlogo-notagline.png" alt="Barrett-Jackson Logo">
    </div>

    <h1>Driver App</h1>

    <!-- Driver logo under title -->
    <div class="driver-logo">
      <img src="driverLogo.png" alt="Driver App Logo">
    </div>

    <p>Tap below to download and install the latest internal build.</p>

    <!-- APK download link (version injected via version.json) -->
    <a id="downloadBtn" class="button" download>
      Download & Install APK
    </a>

    <div class="note">
      If your device blocks the install, go to<br>
      <b>Settings → Security → Install unknown apps</b><br>
      and allow your browser to install from this source.
    </div>
  </div>

  <footer>© 2025 Barrett-Jackson – Internal Use Only</footer>

  <script>
    fetch('version.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) {
          throw new Error('version.json not found');
        }
        return response.json();
      })
      .then(data => {
        const btn = document.getElementById('downloadBtn');
        btn.href = data.apk;
        btn.textContent = `Download & Install APK - ${data.version}`;
      })
      .catch(err => {
        console.error(err);
      });
  </script>
</body>
</html>
